name = "nie-music-api"
main = "src/index.js"
compatibility_date = "2026-07-30"
workers_dev = true

[vars]
# 逗号分隔；上线后建议只保留你的 GitHub Pages / 自定义域名。
ALLOWED_ORIGINS = "http://localhost:8080,http://127.0.0.1:8080,https://YOUR_NAME.github.io"
METING_ENDPOINT = "https://api.qijieya.cn/meting/"

[[d1_databases]]
binding = "DB"
database_name = "nie-music"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[secrets]
required = ["CY_API_KEY"]
